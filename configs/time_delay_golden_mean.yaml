# Configuration for time-delay transformer on golden mean dataset
# This architecture achieved 100% accuracy in experiments

# Model architecture
model_type: "time_delay"
vocab_size: 3
d_model: 64
n_layers: 4
n_heads: 4
dropout: 0.1
delay: 10

# Training parameters
epochs: 30
batch_size: 32
lr: 0.001
weight_decay: 0.01
grad_clip: 1.0

# Data parameters
chunk_size: 500  # Larger chunks for time-delay architecture
test_split: 0.2

# Paths
train_path: "domain_machines/golden_mean/golden_mean/golden_mean.dat"
output_dir: "checkpoints/time_delay_golden_mean"

# Training schedule
save_every: 10
early_stopping_patience: 15