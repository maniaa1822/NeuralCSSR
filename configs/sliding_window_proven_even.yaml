model:
  type: sliding_window
  d_model: 16
  n_layers: 2
  n_heads: 2
  d_ff: 64
  window_size: 25
  vocab_size: 2

training:
  epochs: 5
  batch_size: 64
  learning_rate: 0.001
  sliding_window: true
  
logging:
  output_dir: checkpoints/sliding_window_proven_even
  save_every: 5
  eval_every: 1

data:
  train_path: temp_proven_even_train.dat 
  chunk_size: 25
  test_split: 0.1