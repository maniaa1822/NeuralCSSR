# Configuration for streamlined transformer on golden mean dataset
# This replicates the successful 98.5% accuracy configuration

# Model architecture
model_type: "streamlined"
vocab_size: 3
d_model: 64
n_layers: 2
n_heads: 4
dropout: 0.1

# Training parameters
epochs: 10
batch_size: 32
lr: 0.001
weight_decay: 0.01
grad_clip: 1.0

# Data parameters
chunk_size: 25
test_split: 0.2

# Paths
train_path: "domain_machines/golden_mean/golden_mean/golden_mean.dat"
output_dir: "checkpoints/streamlined_golden_mean"

# Training schedule
save_every: 5
early_stopping_patience: 10