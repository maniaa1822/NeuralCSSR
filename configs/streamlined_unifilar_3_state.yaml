model:
  type: sliding_window
  vocab_size: 3
  d_model: 24
  n_layers: 2
  n_heads: 3
  window_size: 25
  dropout: 0.1

training:
  epochs: 5
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clipping: 1.0
  
data:
  train_path: "transCSSR/data/unifilar_3_state.dat"
  chunk_size: 25
  sliding_window: true
  test_split: 0.2
  
experiment:
  name: "sliding_window_unifilar_3_state"
  output_dir: "checkpoints/sliding_window_unifilar_3_state"
  
logging:
  log_interval: 100
  eval_interval: 500
  save_best: true
