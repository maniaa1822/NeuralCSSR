# Configuration for streamlined transformer on seven state human dataset
# This replicates the validated training setup

# Model architecture
model_type: "streamlined"
vocab_size: 3
d_model: 8
n_layers: 2
n_heads: 4
dropout: 0.1

# Training parameters
epochs: 10
batch_size: 32
lr: 0.001
weight_decay: 0.01
grad_clip: 1.0

# Data parameters
chunk_size: 25
test_split: 0.2

# Paths
train_path: "domain_machines/seven_state_human/seven_state_human/seven_state_human.dat"
output_dir: "checkpoints/streamlined_seven_state"

# Training schedule
save_every: 5
early_stopping_patience: 10