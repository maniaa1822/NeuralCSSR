# Configuration for training on distinct 6-state unifilar machine
# This machine has highly distinguishable emission patterns to test
# whether clear state boundaries can maintain good neural-causal compatibility
# even with higher state complexity (6 states vs 2-3)

model:
  type: sliding_window
  vocab_size: 2        # Binary alphabet {0, 1}
  d_model: 24          # Model dimension - same as successful configs
  n_layers: 2          # Number of transformer layers
  n_heads: 3           # Number of attention heads
  window_size: 25      # Sliding window size for local attention
  dropout: 0.1         # Dropout rate

training:
  epochs: 5         # More epochs for complex 6-state system
  batch_size: 64       # Training batch size
  learning_rate: 0.001 # Initial learning rate
  weight_decay: 0.01   # L2 regularization
  gradient_clipping: 1.0 # Gradient clipping
  
data:
  train_path: "domain_machines/distinct_6_state/distinct_6_state.dat"
  chunk_size: 25       # Same as window size
  sliding_window: true # Enable overlapping windows for more training data
  test_split: 0.1      # 10% for testing
  
experiment:
  name: "sliding_window_distinct_6_state"
  output_dir: "checkpoints/sliding_window_distinct_6_state"
  
logging:
  log_interval: 100    # Log every N steps
  eval_interval: 500   # Evaluate every N steps
  save_best: true      # Save best checkpoint
  
generation:
  eval_length: 1000    # Length for evaluation generation
  temperature: 0.8     # Temperature for generation
  seed: "1001"         # Seed for generation

# Expected performance characteristics:
# - 6 states with highly distinct emission patterns:
#   State A: 95% → 0, 5% → 1   (Almost pure 0)
#   State B: 5% → 0, 95% → 1   (Almost pure 1)  
#   State C: 80% → 0, 20% → 1  (Strong 0 bias)
#   State D: 20% → 0, 80% → 1  (Strong 1 bias)
#   State E: 50% → 0, 50% → 1  (Balanced)
#   State F: 99% → 0, 1% → 1   (Extreme 0 bias)
#
# Hypothesis: Despite 6 states, the highly distinguishable emission
# patterns should enable better neural-causal compatibility than
# the overlapping 3-state unifilar machine (0.582 compatibility).
# Target: Achieve >0.7 compatibility to validate that emission
# pattern distinguishability matters more than state count.
